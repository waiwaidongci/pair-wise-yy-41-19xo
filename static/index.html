<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桥梁结构监测与限行决策</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}input{padding:.4rem;margin:.15rem}table{border-collapse:collapse;width:100%;margin:1rem 0}td,th{border:1px solid #d5dde3;padding:.4rem .6rem;text-align:left;font-size:.9rem}.blocked{color:#b3261e}.ok{color:#1b7f3b}fieldset{margin:1rem 0}</style></head><body><h1>桥梁结构监测与限行决策</h1><p>融合传感、巡检、交通荷载和天气数据，生成限载限行或恢复建议。监测点更换传感器后必须补录校准台账，新告警与限行封闭判断才会放行。</p>
<fieldset><legend>登记校准（sensor_operator/bridge_engineer）</legend>
<input id="cPoint" placeholder="测点 point_ref" value="PT-1"><input id="cDevice" placeholder="设备编号 device_id" value="DEV-1"><input id="cAt" placeholder="校准时间" value="2026-09-26T00:00:00Z"><input id="cFactor" placeholder="修正系数" value="1.0" size="6"><input id="cUntil" placeholder="有效期至" value="2027-09-26T00:00:00Z"><label><input id="cReplace" type="checkbox">替换现有生效记录</label>
<button onclick="registerCalibration()">登记校准</button></fieldset>
<fieldset><legend>按测点重算（未结束告警按新系数重算，历史结论保留）</legend>
<input id="rPoint" placeholder="测点 point_ref" value="PT-1"><input id="rDevice" placeholder="读数设备(可选)">
<button onclick="recalculate()">重算</button>
<button onclick="loadCalibrations()">查询校准台账</button>
<button onclick="loadItems()">刷新告警列表</button></fieldset>
<div id="items"></div><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre>
<script>
const H={'Content-Type':'application/json','X-Actor':'demo','X-Role':'sensor_operator'};
const V={'X-Actor':'demo','X-Role':'viewer'};
function show(d){document.getElementById('out').textContent=JSON.stringify(d,null,2)}
async function registerCalibration(){const r=await fetch('/api/calibrations',{method:'POST',headers:H,body:JSON.stringify({point_ref:cPoint.value,device_id:cDevice.value,calibrated_at:cAt.value,factor:parseFloat(cFactor.value),valid_until:cUntil.value,replace:cReplace.checked})});show(await r.json())}
async function recalculate(){const body={point_ref:rPoint.value};if(rDevice.value)body.device_id=rDevice.value;const r=await fetch('/api/calibrations/recalculate',{method:'POST',headers:H,body:JSON.stringify(body)});show(await r.json())}
async function loadCalibrations(){const r=await fetch('/api/calibrations?point_ref='+encodeURIComponent(rPoint.value),{headers:V});show(await r.json())}
async function loadItems(){const r=await fetch('/api/items',{headers:V});const d=await r.json();const rows=(d.items||[]).map(i=>{const c=i.calibration;const ver=c?('#'+c.id+' 设备'+c.device_id+' 系数'+c.factor+' 有效期至'+c.valid_until):'无生效校准';const blk=(i.calibration_blockers||[]);return `<tr><td>${i.id}</td><td>${i.title}</td><td>${i.status}</td><td>${i.point_ref||''}</td><td>${i.device_id||''}</td><td>依据校准#${i.calibration_id??'-'} 系数${i.factor}</td><td>${ver}</td><td class="${blk.length?'blocked':'ok'}">${blk.length?blk.join('；'):'放行'}</td></tr>`}).join('');document.getElementById('items').innerHTML='<table><tr><th>ID</th><th>标题</th><th>状态</th><th>测点</th><th>设备</th><th>结论依据</th><th>当前生效版本</th><th>受阻原因</th></tr>'+rows+'</table>'}
</script></body></html>
